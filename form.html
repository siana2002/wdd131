<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Product Review - Douglas Tangi</title>
    <meta name="description" content="A product review page containing product names, ratings and useful features. "> 
    <meta name="author" content="Douglas Tangi">

    <!-- LINKS TO CSS -->
    <link rel="stylesheet" href="styles/form.css">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- SCRIPTS -->
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <fieldset>
                <div class="base">
                    <label for="product">Product Name❗️ (Required)</label>
                    <select id="product" name="productName" required>
                        <option value="" disabled selected>Select a product</option>
                    </select>
                </div>
                <div>
                    <label>Overall Rating❗️ (Required)</label>
                    <div class="rating">
                        <label for="rating1">
                            ⭐︎
                            <input type="radio" id="rating1" name="rating" value="1" required>
                        </label>
                        <label for="rating2">
                            ⭐︎⭐︎
                            <input type="radio" id="rating2" name="rating" value="2" required>
                        </label>
                        <label for="rating3">
                            ⭐︎⭐︎⭐︎
                            <input type="radio" id="rating3" name="rating" value="3" required>
                        </label>
                        <label for="rating4">
                            ⭐︎⭐︎⭐︎⭐︎
                            <input type="radio" id="rating4" name="rating" value="4" required>
                        </label>
                        <label for="rating5">
                            ⭐︎⭐︎⭐︎⭐︎⭐︎
                            <input type="radio" id="rating5" name="rating" value="5" required>
                        </label>
                    </div>
                </div>
                <div class="base">
                    <label for="visit-date">Date of Installation❗️ (Required)</label>
                    <input type="date" id="visit-date" name="Date of Installation" required>
                </div>
                <p>Which features did you find useful in the product? (Check all that apply)❗️ (Required)</p>
                <div class="checkbox">
                    <label for="durability">
                        <input type="checkbox" id="durability" name="features" value="durability" required>
                        Durability
                    </label><br>
                    <label for="ease-of-use">
                        <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                        Ease of Use
                    </label><br>
                    <label for="performance">
                        <input type="checkbox" id="performance" name="features" value="performance">
                        Performance
                    </label><br>
                    <label for="design">
                        <input type="checkbox" id="design" name="features" value="design">
                        Design
                    </label><br>
                </div>
                <div class="message">
                    <label for="message">Written Review (Optional)</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>
                <div class="base">
                    <label for="name">Your Name (Optional)</label>
                    <input type="text" id="name" name="name">
                </div>
                <div class="submit">
                    <input type="submit" value="Post Review">
                </div>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentYear"></span> | Douglas Tangi | New Zealand</p>
        <p class="foot" id="lastModified"></p>
    </footer>
</body>
</html>
